name: Añadir tráiler multijugador de Gears E-Day

on:
  push:
    paths:
      - ".github/workflows/update-gears-multiplayer-trailer-temp.yml"

permissions:
  contents: write

jobs:
  update:
    if: github.ref == 'refs/heads/bot/game-hub-2026-07-30-gears-multiplayer-trailer'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot/game-hub-2026-07-30-gears-multiplayer-trailer
      - name: Actualizar ficha
        shell: python
        run: |
          import json
          from pathlib import Path

          json_path = Path('data/game-hubs/gears-of-war-e-day.json')
          data = json.loads(json_path.read_text(encoding='utf-8'))
          video_id = 'cmawSe1PkPg'
          if not any(item.get('videoId') == video_id for item in data['media']):
              data['media'].insert(0, {
                  'type': 'youtube',
                  'videoId': video_id,
                  'title': 'Gears of War: E-Day, presentación oficial del multijugador',
                  'label': 'Multijugador',
                  'publishedAt': '2026-07-30'
              })
          change_title = 'Publicado el tráiler oficial del multijugador'
          if not any(item.get('title') == change_title for item in data['changes']):
              data['changes'].insert(0, {
                  'date': '2026-07-30',
                  'title': change_title,
                  'description': 'Xbox y The Coalition mostraron Horde Siege y Versus en una presentación oficial centrada en el multijugador.'
              })
          data['updatedAt'] = '2026-07-30'
          json_path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          html_path = Path('juegos/gears-of-war-e-day.html')
          html = html_path.read_text(encoding='utf-8')
          if video_id not in html:
              html = html.replace(
                  '"trailer":[',
                  '"trailer":[{"@type":"VideoObject","name":"Gears of War: E-Day, presentación oficial del multijugador","thumbnailUrl":"https://i.ytimg.com/vi/cmawSe1PkPg/maxresdefault.jpg","uploadDate":"2026-07-30","embedUrl":"https://www.youtube.com/embed/cmawSe1PkPg"},',
                  1
              )
              marker = '          <div class="game-media-track">\n'
              card = '''          <div class="game-media-track">\n      <article class="game-media-card game-media-slide" aria-hidden="false">\n        <div class="game-media-frame">\n          <iframe\n            src="https://www.youtube-nocookie.com/embed/cmawSe1PkPg?rel=0"\n            title="Gears of War: E-Day, presentación oficial del multijugador"\n            loading="lazy"\n            referrerpolicy="strict-origin-when-cross-origin"\n            allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"\n            allowfullscreen></iframe>\n        </div>\n        <div class="game-media-meta">\n          <div>\n            <span class="game-kicker">Multijugador</span>\n            <h3>Gears of War: E-Day, presentación oficial del multijugador</h3>\n            <time datetime="2026-07-30">30 de julio de 2026</time>\n          </div>\n          <a href="https://www.youtube.com/watch?v=cmawSe1PkPg" target="_blank" rel="noopener noreferrer">Ver en YouTube ↗</a>\n        </div>\n      </article>\n'''
              if marker not in html:
                  raise SystemExit('No se encontró el carrusel multimedia')
              html = html.replace(marker, card, 1)
              html = html.replace(
                  '<article class="game-media-card game-media-slide" aria-hidden="false">\n        <div class="game-media-frame">\n          <iframe\n            src="https://www.youtube-nocookie.com/embed/dFk4bL3a8I8?rel=0"',
                  '<article class="game-media-card game-media-slide" aria-hidden="true">\n        <div class="game-media-frame">\n          <iframe\n            src="https://www.youtube-nocookie.com/embed/dFk4bL3a8I8?rel=0"',
                  1
              )
              old_changes = '<ol class="game-change-list" id="gameChangeList">'
              new_change = '<ol class="game-change-list" id="gameChangeList"><li class="game-change-item"><time datetime="2026-07-30">30 de julio de 2026</time><div><h3>Publicado el tráiler oficial del multijugador</h3><p>Xbox y The Coalition mostraron Horde Siege y Versus en una presentación oficial centrada en el multijugador.</p></div></li>'
              html = html.replace(old_changes, new_change, 1)
          html_path.write_text(html, encoding='utf-8')
      - name: Validar y limpiar
        run: |
          python -m json.tool data/game-hubs/gears-of-war-e-day.json >/dev/null
          grep -q "cmawSe1PkPg" data/game-hubs/gears-of-war-e-day.json
          grep -q "cmawSe1PkPg" juegos/gears-of-war-e-day.html
          git rm .github/workflows/update-gears-multiplayer-trailer-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-hubs/gears-of-war-e-day.json juegos/gears-of-war-e-day.html
          git commit -m "Añade el tráiler multijugador de Gears E-Day"
          git push origin HEAD:bot/game-hub-2026-07-30-gears-multiplayer-trailer
