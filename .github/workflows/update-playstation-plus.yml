name: Actualizar PlayStation Plus

on:
  schedule:
    - cron: "17 8 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-playstation-plus
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configurar Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Actualizar una PR existente
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bot/playstation-plus-auto"
          number="$(gh pr list --state open --head "$branch" --json number --jq '.[0].number // empty')"
          if [ -z "$number" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"
          git fetch origin "$branch"
          git checkout -B "$branch" "origin/$branch"
          git merge --no-edit origin/main
          node scripts/run-ps-plus-update.mjs

          if git diff --quiet; then
            echo "La PR existente ya contiene todos los datos oficiales disponibles."
            exit 0
          fi

          git add data/playstation-plus.json
          git commit -m "Actualiza PlayStation Plus"
          git push origin "$branch"

      - name: Buscar novedades oficiales
        if: steps.existing.outputs.found != 'true'
        id: changes
        run: |
          node scripts/run-ps-plus-update.mjs
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Abrir PR en borrador
        if: steps.existing.outputs.found != 'true' && steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bot/playstation-plus-auto"
          git checkout -b "$branch"
          git add data/playstation-plus.json
          git commit -m "Actualiza PlayStation Plus"
          git push -u origin "$branch"
          gh pr create \
            --draft \
            --base main \
            --head "$branch" \
            --title "Actualiza los juegos de PlayStation Plus" \
            --body $'## Qué cambia\n\nActualiza la página mensual de PlayStation Plus a partir de publicaciones oficiales de PlayStation Blog.\n\n## Revisión necesaria\n\n- Comprobar títulos, planes, consolas y fechas.\n- Revisar las imágenes y sus recortes en escritorio y móvil.\n- Confirmar que la selección coincide con España y Europa.\n\nLa automatización nunca fusiona la PR.'
