name: Corregir énfasis en tarjetas

on:
  push:
    branches:
      - bot/news-2026-07-30-1620-xbox-double-fine
    paths:
      - .github/workflows/fix-news-emphasis-once.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot/news-2026-07-30-1620-xbox-double-fine

      - name: Aplicar énfasis al texto visible
        shell: python
        run: |
          from pathlib import Path

          path = Path("js/news.js")
          content = path.read_text(encoding="utf-8")
          original = content
          content = content.replace(
              '${escapeHTML(text(item.summary, lang))}',
              '${emphasizedHTML(item.summary, item, lang)}'
          )
          content = content.replace(
              '${escapeHTML(text(item.why, lang))}',
              '${emphasizedHTML(item.why, item, lang)}'
          )
          if content == original:
              raise SystemExit("No se encontró ningún renderizado que corregir")
          path.write_text(content, encoding="utf-8")

      - name: Validar y guardar
        shell: bash
        run: |
          node --check js/news.js
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/news.js
          git rm .github/workflows/fix-news-emphasis-once.yml
          git commit -m "Muestra las negritas en las tarjetas de noticias"
          git push
