name: Despachar Noticias automáticas

on:
  workflow_run:
    workflows: ["Pipeline de Noticias"]
    types: [completed]

permissions:
  actions: write
  contents: read
  pull-requests: write

concurrency:
  group: dispatch-news-bot-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  dispatch:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'skipped' &&
      startsWith(github.event.workflow_run.head_branch, 'bot/news-') &&
      github.event.workflow_run.pull_requests[0].number != null
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ github.event.workflow_run.pull_requests[0].number }}
    steps:
      - name: Verificar la PR automática
        id: verify
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(printf '%s' "$pr" | jq -r .state)"
          draft="$(printf '%s' "$pr" | jq -r .draft)"
          base_ref="$(printf '%s' "$pr" | jq -r .base.ref)"
          head_ref="$(printf '%s' "$pr" | jq -r .head.ref)"
          head_repo="$(printf '%s' "$pr" | jq -r .head.repo.full_name)"

          if [ "$state" != "open" ] || [ "$draft" != "false" ] || [ "$base_ref" != "main" ]; then
            echo "La PR automática ya no está abierta, lista y basada en main."
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "La PR automática no procede del repositorio principal."
            exit 1
          fi
          case "$head_ref" in
            bot/news-*) ;;
            *)
              echo "La rama no pertenece a la automatización de Noticias."
              exit 1
              ;;
          esac

          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^data/news/[a-z0-9]+(-[a-z0-9]+)*\.json$' || true)"
          if [ -n "$invalid" ]; then
            echo "La PR automática contiene archivos no autorizados:"
            echo "$invalid"
            exit 1
          fi

          echo "eligible=true" >> "$GITHUB_OUTPUT"
          echo "head_ref=$head_ref" >> "$GITHUB_OUTPUT"

      - name: Registrar ejecuciones anteriores
        if: steps.verify.outputs.eligible == 'true'
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate-news.yml/runs?event=workflow_dispatch&per_page=30" \
            --jq '.workflow_runs[].id' | sort -n > /tmp/news-runs-before.txt

      - name: Lanzar la validación protegida
        if: steps.verify.outputs.eligible == 'true'
        run: |
          gh workflow run validate-news.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            -f "pr_number=$PR_NUMBER" \
            -f "head_ref=${{ steps.verify.outputs.head_ref }}"

      - name: Localizar la ejecución protegida
        if: steps.verify.outputs.eligible == 'true'
        id: locate
        run: |
          run_id=""
          for attempt in $(seq 1 30); do
            gh api "repos/$GITHUB_REPOSITORY/actions/workflows/validate-news.yml/runs?event=workflow_dispatch&per_page=30" \
              --jq '.workflow_runs[].id' | sort -n > /tmp/news-runs-after.txt
            run_id="$(comm -13 /tmp/news-runs-before.txt /tmp/news-runs-after.txt | tail -n 1)"
            if [ -n "$run_id" ]; then break; fi
            sleep 2
          done
          if [ -z "$run_id" ]; then
            echo "No se pudo localizar la ejecución protegida recién creada."
            exit 1
          fi
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          echo "Ejecución protegida: $run_id"

      - name: Esperar el resultado protegido
        if: steps.verify.outputs.eligible == 'true'
        id: protected
        continue-on-error: true
        run: gh run watch "${{ steps.locate.outputs.run_id }}" --repo "$GITHUB_REPOSITORY" --exit-status --interval 5

      - name: Publicar diagnóstico si falla
        if: steps.verify.outputs.eligible == 'true' && steps.protected.outcome == 'failure'
        run: |
          run_id="${{ steps.locate.outputs.run_id }}"
          gh run view "$run_id" --repo "$GITHUB_REPOSITORY" --log-failed > /tmp/news-failure.log 2>&1 || true
          tail -c 12000 /tmp/news-failure.log > /tmp/news-failure-tail.log
          {
            echo "## Automatización de Noticias bloqueada"
            echo
            echo "La validación protegida no ha podido completar esta PR. Último registro de error:"
            echo
            echo '```text'
            cat /tmp/news-failure-tail.log
            echo '```'
            echo
            echo "Ejecución: https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id"
          } > /tmp/news-comment.md
          gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body-file /tmp/news-comment.md
          exit 1
