name: Construcción temporal State of Play

on:
  push:
    branches: [feature/state-of-play-sep-2026]
    paths:
      - ".github/workflows/_temp-build-state-of-play.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v4
        with:
          ref: feature/state-of-play-sep-2026
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar cambios de arquitectura
        run: |
          node --check scripts/_temp-build-state-of-play.mjs
          node scripts/_temp-build-state-of-play.mjs prepare
          node --check scripts/render-events.mjs
          node --check scripts/validate-events.mjs
          node --check js/event-hub.js
          node --check js/home-featured.js

      - name: Regenerar Noticias y fichas relacionadas
        run: |
          node scripts/build-news-index.mjs
          node scripts/render-news.mjs
          node scripts/render-game-hubs.mjs
          node scripts/render-game-hub-pc-requirements.mjs
          node scripts/render-game-hub-editions.mjs

      - name: Generar el especial y finalizar la portada
        run: |
          node scripts/render-events.mjs
          node scripts/_temp-build-state-of-play.mjs finalize
          node scripts/generate-sitemap.mjs

      - name: Validar el resultado
        run: |
          node scripts/validate-events.mjs
          node scripts/validate-news.mjs
          node scripts/validate-game-hubs.mjs
          node scripts/validate-game-hub-pc-requirements.mjs
          node scripts/validate-game-hub-editions.mjs
          git diff --check

      - name: Guardar la cobertura terminada
        run: |
          rm scripts/_temp-build-state-of-play.mjs
          rm .github/workflows/_temp-build-state-of-play.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Añadir cobertura del State of Play de septiembre"
          git push origin HEAD:feature/state-of-play-sep-2026
