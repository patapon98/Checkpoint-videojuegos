name: Valida fichas de juego

on:
  pull_request:
    paths:
      - 'data/game-hubs/**'
      - 'juegos/**'
      - 'scripts/validate-game-hubs.mjs'
      - '.github/workflows/validate-game-hubs.yml'
  push:
    paths:
      - 'data/game-hubs/**'
      - 'juegos/**'
      - 'scripts/validate-game-hubs.mjs'
      - '.github/workflows/validate-game-hubs.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Comprobar fichas vivas
        run: node scripts/validate-game-hubs.mjs
