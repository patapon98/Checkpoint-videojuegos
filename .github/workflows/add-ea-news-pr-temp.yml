name: Preparar noticia de Electronic Arts

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  update:
    if: github.head_ref == 'bot/news-2026-07-31-2013-ea-cierre-compra'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot/news-2026-07-31-2013-ea-cierre-compra
      - name: Aplicar cambios
        run: python .github/scripts/add_ea_news_temp.py
      - name: Validar y limpiar
        run: |
          node --check js/news-data.js
          node --check js/news.js
          test "$(grep -c 'id: \"ea-autorizacion-final-compra-2026\"' js/news-data.js)" -eq 1
          test "$(grep -c '\"ea-autorizacion-final-compra-2026\":' js/news.js)" -eq 1
          git rm .github/workflows/add-ea-news-temp.yml
          git rm .github/workflows/add-ea-news-pr-temp.yml
          git rm .github/scripts/add_ea_news_temp.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/news-data.js js/news.js index.html noticias.html
          git commit -m "Añade la autorización final de la compra de EA"
          git push origin HEAD:bot/news-2026-07-31-2013-ea-cierre-compra
