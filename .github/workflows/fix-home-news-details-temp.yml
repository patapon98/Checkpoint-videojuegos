name: Corregir ampliación de tarjetas recientes

on:
  push:
    paths:
      - ".github/workflows/fix-home-news-details-temp.yml"

permissions:
  contents: write

jobs:
  fix:
    if: github.ref == 'refs/heads/bot/news-2026-07-30-1620-xbox-double-fine'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bot/news-2026-07-30-1620-xbox-double-fine
      - name: Añadir ampliaciones propias
        shell: python
        run: |
          from pathlib import Path
          path = Path('js/news.js')
          text = path.read_text(encoding='utf-8')
          marker = '  const homeDetails = {\n'
          insertion = '''  const homeDetails = {\n    "xbox-resultados-junio-2026": {\n      es: [\n        "Microsoft reúne dentro de contenidos y servicios de Xbox las ventas de juegos, el contenido adicional, Game Pass, la nube y la publicidad. La caída del 10% indica que el retroceso no se concentró únicamente en la venta de consolas.",\n        "El hardware también bajó un 13% interanual. El contraste es especialmente relevante porque Microsoft cerró el trimestre con 90.007 millones de dólares de ingresos totales mientras Xbox atravesaba una reestructuración con miles de despidos."\n      ]\n    },\n    "double-fine-despidos-independencia": {\n      es: [\n        "Double Fine es el estudio responsable de Psychonauts. Recuperó su independencia después de que Microsoft acordara separarlo de Xbox durante la reestructuración anunciada en julio.",\n        "El estudio mantiene su nombre, su catálogo y su propiedad intelectual, pero vuelve a asumir directamente sus costes. Tim Schafer vinculó los 23 despidos con la necesidad de reducir la empresa a un tamaño sostenible y proteger su continuidad."\n      ]\n    },\n    "capcom-resultados-ventas-junio-2026": {\n      es: [\n        "Las 23,81 millones de copias corresponden únicamente al periodo comprendido entre abril y junio de 2026. No deben confundirse con las ventas históricas acumuladas que Capcom también publica para cada saga.",\n        "PRAGMATA aportó 2,51 millones de unidades como principal novedad. Los otros 21,26 millones procedieron de juegos publicados antes del ejercicio actual, con Resident Evil, Monster Hunter y Devil May Cry sosteniendo gran parte del negocio."\n      ]\n    },\n    "xbox-caida-global-juegos-fisicos": {\n      es: [\n        "La interrupción se prolongó durante casi 20 horas y afectó al inicio de sesión, las bibliotecas, Game Pass, las compras y el arranque de juegos. El error 0x87e107df apareció también en algunas instalaciones realizadas desde disco.",\n        "El episodio no demuestra que todos los discos de Xbox dependan siempre de internet, pero sí que determinadas licencias y configuraciones necesitan validaciones remotas. Durante la caída, poseer el soporte físico no bastó para garantizar el acceso."\n      ]\n    },\n'''
          if marker not in text:
              raise SystemExit('No se encontró homeDetails')
          text = text.replace(marker, insertion, 1)
          path.write_text(text, encoding='utf-8')
      - name: Validar y limpiar
        run: |
          node --check js/news.js
          git rm .github/workflows/fix-home-news-details-temp.yml
          git config user.name "github-actions[bot]"
          git config user.email "4189828+github-actions[bot]@users.noreply.github.com"
          git add js/news.js
          git commit -m "Amplía el reverso de las cuatro noticias recientes"
          git push origin HEAD:bot/news-2026-07-30-1620-xbox-double-fine
