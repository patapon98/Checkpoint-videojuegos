name: Migrar requisitos y ediciones de fichas

on:
  push:
    paths:
      - 'data/game-hubs/.run-commerce-v1'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: migrate-game-hub-commerce-v1-${{ github.ref }}
  cancel-in-progress: true

jobs:
  migrate:
    if: github.ref_name != 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v4

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Migrar datos técnicos y comerciales
        run: node scripts/migrate-game-hub-commerce-v1.mjs

      - name: Generar todas las secciones derivadas
        run: |
          node scripts/render-game-hubs.mjs
          node scripts/render-game-hub-pc-requirements.mjs
          node scripts/render-game-hub-editions.mjs

      - name: Validar las fichas generadas
        run: |
          node scripts/validate-game-hubs.mjs
          node scripts/validate-game-hub-pc-requirements.mjs
          node scripts/validate-game-hub-editions.mjs
          git diff --check

      - name: Retirar el marcador y guardar la migración
        run: |
          rm -f data/game-hubs/.run-commerce-v1
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- data/game-hubs juegos juegos.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'La migración no produjo cambios.'
            exit 0
          fi
          git commit -m 'Añade requisitos, ediciones y precios estructurados'
          git push
