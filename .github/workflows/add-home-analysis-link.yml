name: Add home analysis links

on:
  push:
    branches:
      - agent/noticia-destacada-playstation

permissions:
  contents: write

jobs:
  update:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/noticia-destacada-playstation
          fetch-depth: 0

      - name: Replace conditional analysis links
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          data_path = Path('js/news-data.js')
          data = data_path.read_text(encoding='utf-8')
          marker = '    tone: "playstation",\n'
          replacement = '    tone: "playstation",\n    articleUrl: "/noticias/playstation-fin-formato-fisico",\n'
          if 'articleUrl: "/noticias/playstation-fin-formato-fisico"' not in data:
              data = data.replace(marker, replacement, 1)
              data_path.write_text(data, encoding='utf-8')

          js_path = Path('js/news.js')
          js = js_path.read_text(encoding='utf-8')
          anchor = '''  function latestBadge(item, lang) {
    if (!item.latest) return "";
    return `<span class="news-latest"><i aria-hidden="true"></i>${lang === "en" ? "Breaking" : "Última hora"}</span>`;
  }
'''
          addition = anchor + '''
  function analysisLink(item, lang) {
    if (!item.articleUrl) return "";
    const label = lang === "en" ? "Read full analysis" : "Leer análisis completo";
    const title = text(item.title, lang);
    return `
      <a class="news-home-analysis-link" href="${escapeHTML(item.articleUrl)}"
         aria-label="${escapeHTML(label)}. ${escapeHTML(title)}">
        <span>${label}</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </a>`;
  }
'''
          if 'function analysisLink(item, lang)' not in js:
              js = js.replace(anchor, addition, 1)

          js = js.replace(
              '        <div class="news-home-expanded-copy">${paragraphs.map(paragraph => `<p>${escapeHTML(paragraph)}</p>`).join("")}</div>\n        ${homeFlipButton(item, lang, true)}',
              '        <div class="news-home-expanded-copy">${paragraphs.map(paragraph => `<p>${escapeHTML(paragraph)}</p>`).join("")}</div>\n        <div class="news-home-actions">${analysisLink(item, lang)}${homeFlipButton(item, lang, true)}</div>'
          )
          js = js.replace(
              '          ${sourceLinks(item, lang, false)}\n          ${homeFlipButton(item, lang, false)}',
              '          ${sourceLinks(item, lang, false)}\n          <div class="news-home-actions">${analysisLink(item, lang)}${homeFlipButton(item, lang, false)}</div>',
              1
          )
          js = js.replace(
              '        ${sourceLinks(item, lang, true)}\n        ${homeFlipButton(item, lang, false)}',
              '        ${sourceLinks(item, lang, true)}\n        <div class="news-home-actions">${analysisLink(item, lang)}${homeFlipButton(item, lang, false)}</div>',
              1
          )
          js_path.write_text(js, encoding='utf-8')

          css_path = Path('css/news.css')
          css = css_path.read_text(encoding='utf-8')
          styles = '''

/* Enlace condicional a análisis individual desde la portada */
.news-home-actions{display:flex;align-items:center;flex-wrap:wrap;gap:10px;margin-top:16px}
.news-home-actions .news-home-flip-button{margin-top:0}
.news-home-analysis-link{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:10px 15px;border-radius:99px;background:var(--button-bg);color:var(--button-ink);font-size:.78rem;font-weight:750;line-height:1;transition:transform .2s,background .2s,color .2s}
.news-home-analysis-link:hover{background:var(--accent);transform:translateY(-2px)}
.news-home-analysis-link:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
.news-home-analysis-link svg{width:16px;height:16px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
@media(max-width:620px){.news-home-actions{align-items:stretch}.news-home-analysis-link{flex:1 1 auto}}
'''
          if '.news-home-analysis-link{' not in css:
              css += styles
              css_path.write_text(css, encoding='utf-8')

          Path('.github/workflows/add-home-analysis-link.yml').unlink()
          PY

      - name: Commit changes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add js/news-data.js js/news.js css/news.css .github/workflows/add-home-analysis-link.yml
          git commit -m "Añade análisis completos a las noticias de portada"
          git push origin HEAD:agent/noticia-destacada-playstation
