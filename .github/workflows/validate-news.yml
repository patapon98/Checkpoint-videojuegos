name: Pipeline de Noticias

on:
  pull_request:
    branches: [main]
    paths:
      - 'data/news/*.json'
      - 'data/news-index.json'
      - 'scripts/build-news-index.mjs'
      - 'scripts/render-news.mjs'
      - 'scripts/render-game-hubs.mjs'
      - 'scripts/validate-news.mjs'
      - 'scripts/validate-news-change.mjs'
      - 'js/news-core.js'
      - 'js/news.js'
      - 'js/news-flip.js'
      - 'js/news-grid.js'
      - 'js/news-article-links.js'
      - 'js/game-hub.js'
      - 'css/news.css'
      - 'css/news-grid.css'
      - 'index.html'
      - 'noticias.html'
      - 'juegos/*.html'
      - 'juegos.html'
      - 'docs/NEWS_AUTOMATION.md'
      - 'docs/PROJECT_RULES.md'
      - '.github/workflows/dispatch-news-bot.yml'
      - '.github/workflows/validate-news.yml'
      - 'serve.py'
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'data/news/*.json'
  push:
    branches: [main]
    paths:
      - 'data/news/*.json'
      - 'scripts/build-news-index.mjs'
      - 'scripts/render-news.mjs'
      - 'scripts/render-game-hubs.mjs'
      - 'scripts/validate-news.mjs'
      - 'js/news-core.js'
      - 'js/news.js'
      - 'js/news-flip.js'
      - 'js/news-grid.js'
      - 'js/news-article-links.js'
      - 'js/game-hub.js'
      - 'css/news.css'
      - 'css/news-grid.css'
      - '.github/workflows/validate-news.yml'
      - 'serve.py'
  schedule:
    - cron: "0 */3 * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número de PR automática que debe procesarse"
        required: false
        type: string
      head_ref:
        description: "Rama automática esperada"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: news-pipeline-${{ github.event_name }}-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Lanzar la validación de las PR automáticas abiertas
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.draft == false and (.head.ref | startswith("bot/news-")) and .head.repo.full_name == env.GITHUB_REPOSITORY) | [.number, .head.ref] | @tsv' |
          while IFS=$'\t' read -r number head_ref; do
            gh workflow run validate-news.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f "pr_number=$number" \
              -f "head_ref=$head_ref"
          done

  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event_name == 'pull_request_target' && startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/news-')) ||
          (github.event_name == 'pull_request' && !startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/news-'))
        )
      )
    runs-on: ubuntu-latest
    steps:
      - name: Comprobar la PR automática antes de descargarla
        if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REQUESTED_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(printf '%s' "$pr" | jq -r .state)"
          draft="$(printf '%s' "$pr" | jq -r .draft)"
          base_ref="$(printf '%s' "$pr" | jq -r .base.ref)"
          head_ref="$(printf '%s' "$pr" | jq -r .head.ref)"
          head_repo="$(printf '%s' "$pr" | jq -r .head.repo.full_name)"

          if [ "$state" != "open" ] || [ "$draft" != "false" ] || [ "$base_ref" != "main" ]; then
            echo "La PR automática no está abierta, lista y basada en main."
            exit 1
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "La PR automática no procede del repositorio principal."
            exit 1
          fi
          if [ "$head_ref" != "$REQUESTED_REF" ]; then
            echo "La rama solicitada ya no coincide con la cabecera de la PR."
            exit 1
          fi
          case "$head_ref" in
            bot/news-*) ;;
            *)
              echo "La rama no pertenece a la automatización de Noticias."
              exit 1
              ;;
          esac

          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^data/news/[a-z0-9]+(-[a-z0-9]+)*\.json$' || true)"
          if [ -n "$invalid" ]; then
            echo "La PR automática contiene archivos no autorizados antes de descargarla:"
            echo "$invalid"
            exit 1
          fi

      - name: Descargar la rama del PR
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref || github.event.pull_request.head.ref || github.head_ref }}
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Obtener main para validar la PR
        run: git fetch origin main

      - name: Comprobar sintaxis
        run: |
          node --check scripts/build-news-index.mjs
          node --check scripts/render-news.mjs
          node --check scripts/validate-news.mjs
          node --check scripts/validate-news-change.mjs
          node --check scripts/render-game-hubs.mjs
          node --check scripts/render-game-hub-pc-requirements.mjs
          node --check scripts/render-game-hub-editions.mjs
          node --check scripts/validate-game-hubs.mjs
          node --check scripts/validate-game-hub-pc-requirements.mjs
          node --check scripts/validate-game-hub-editions.mjs
          node --check js/news-core.js
          node --check js/news-flip.js
          node --check js/news-grid.js
          node --check js/news-article-links.js
          python -m py_compile serve.py

      - name: Limitar las entregas automáticas
        env:
          GITHUB_HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref || github.head_ref }}
        run: node scripts/validate-news-change.mjs

      - name: Generar el índice y las superficies de Noticias
        run: |
          node scripts/build-news-index.mjs
          node scripts/render-news.mjs
          node scripts/render-game-hubs.mjs
          node scripts/render-game-hub-pc-requirements.mjs
          node scripts/render-game-hub-editions.mjs

      - name: Ejecutar todas las validaciones
        run: |
          node scripts/validate-news.mjs
          node scripts/validate-game-hubs.mjs
          node scripts/validate-game-hub-pc-requirements.mjs
          node scripts/validate-game-hub-editions.mjs
          git diff --check

      - name: Fusionar el resultado final verificado
        if: startsWith(inputs.head_ref || github.event.pull_request.head.ref || github.head_ref, 'bot/news-')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref || github.head_ref }}
        run: |
          expected_sha="$(git rev-parse HEAD)"
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(printf '%s' "$pr" | jq -r .state)"
          draft="$(printf '%s' "$pr" | jq -r .draft)"
          base_ref="$(printf '%s' "$pr" | jq -r .base.ref)"
          head_ref="$(printf '%s' "$pr" | jq -r .head.ref)"
          remote_sha="$(printf '%s' "$pr" | jq -r .head.sha)"
          head_repo="$(printf '%s' "$pr" | jq -r .head.repo.full_name)"

          if [ "$state" != "open" ] || [ "$draft" != "false" ] || [ "$base_ref" != "main" ]; then
            echo "La PR no está abierta, lista y basada en main."
            exit 1
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ] || [ "$head_ref" != "$EXPECTED_REF" ]; then
            echo "La cabecera de la PR ya no coincide con la rama automática validada."
            exit 1
          fi
          if [ "$remote_sha" != "$expected_sha" ]; then
            echo "La cabecera remota cambió después de la validación."
            echo "Esperada: $expected_sha"
            echo "Remota:   $remote_sha"
            exit 1
          fi

          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^data/news/[a-z0-9]+(-[a-z0-9]+)*\.json$' || true)"
          if [ -n "$invalid" ]; then
            echo "La PR automática contiene archivos no autorizados:"
            echo "$invalid"
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$expected_sha"

  generate:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar sintaxis
        run: |
          node --check scripts/build-news-index.mjs
          node --check scripts/render-news.mjs
          node --check scripts/validate-news.mjs
          node --check scripts/render-game-hubs.mjs
          node --check scripts/validate-game-hubs.mjs
          node --check scripts/render-game-hub-pc-requirements.mjs
          node --check scripts/render-game-hub-editions.mjs
          node --check scripts/validate-game-hub-pc-requirements.mjs
          node --check scripts/validate-game-hub-editions.mjs
          node --check js/news-core.js
          node --check js/news-flip.js
          node --check js/news-grid.js
          node --check js/news-article-links.js
          python -m py_compile serve.py

      - name: Generar el índice y las superficies de Noticias
        run: |
          node scripts/build-news-index.mjs
          node scripts/render-news.mjs
          node scripts/render-game-hubs.mjs
          node scripts/render-game-hub-pc-requirements.mjs
          node scripts/render-game-hub-editions.mjs

      - name: Ejecutar todas las validaciones
        run: |
          node scripts/validate-news.mjs
          node scripts/validate-game-hubs.mjs
          node scripts/validate-game-hub-pc-requirements.mjs
          node scripts/validate-game-hub-editions.mjs
          git diff --check

      - name: Guardar únicamente archivos generados
        run: |
          git add -- data/news-index.json index.html noticias.html juegos juegos.html sitemap.xml
          if git diff --cached --quiet; then
            echo 'Las salidas de Noticias ya están sincronizadas.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Genera las superficies derivadas de Noticias'
          git push origin HEAD:main
