name: Actualizar ficha de God of War Laufey

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-god-of-war-laufey
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Configurar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar imágenes y datos RAWG
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: node scripts/update-god-of-war-laufey-rawg.mjs

      - name: Detectar cambios
        id: changes
        run: |
          if git diff --quiet -- data/game-hubs/god-of-war-laufey.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Crear o actualizar rama automática
        if: steps.changes.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          branch="bot/god-of-war-laufey-rawg"
          git config user.name "final-secreto-bot"
          git config user.email "actions@users.noreply.github.com"
          git checkout -B "$branch"
          git add data/game-hubs/god-of-war-laufey.json
          git commit -m "Actualiza recursos RAWG de God of War Laufey"
          git push --force-with-lease origin "$branch"
          existing="$(gh pr list --head "$branch" --base main --state open --json number --jq '.[0].number // empty')"
          if [ -z "$existing" ]; then
            gh pr create --draft --base main --head "$branch" --title "Actualiza recursos RAWG de God of War Laufey" --body $'## Qué cambia\n\nSincroniza la imagen principal y la galería de la ficha desde RAWG.\n\n## Seguridad editorial\n\nLa automatización solo modifica los campos RAWG del archivo de datos. No publica noticias, rumores ni texto editorial.'
          fi
