name: Preparar calendario estructurado

on:
  push:
    branches:
      - agent/automatic-release-calendar
    paths:
      - "scripts/calendar-utils.mjs"
      - "scripts/migrate-calendar-data.mjs"
      - "scripts/generate-release-calendar.mjs"
      - ".github/workflows/bootstrap-calendar-data.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-release-calendar
  cancel-in-progress: false

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/automatic-release-calendar
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Comprobar sintaxis
        run: |
          node --check scripts/calendar-utils.mjs
          node --check scripts/migrate-calendar-data.mjs
          node --check scripts/generate-release-calendar.mjs

      - name: Migrar y generar
        env:
          CALENDAR_TODAY: "2026-07-29"
        run: |
          node scripts/migrate-calendar-data.mjs
          node scripts/generate-release-calendar.mjs
          git diff --check

      - name: Guardar resultado
        run: |
          if git diff --quiet; then
            echo "El calendario ya estaba preparado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json calendario.html index.html
          git commit -m "Migra el calendario a datos estructurados"
          git push origin HEAD:agent/automatic-release-calendar
