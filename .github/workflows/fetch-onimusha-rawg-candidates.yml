name: Preparar imágenes RAWG de Onimusha

on:
  workflow_dispatch:
  push:
    branches:
      - agent/fix-psplus-and-game-hub-images
    paths:
      - scripts/fetch-onimusha-rawg-candidates.mjs

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v4
        with:
          ref: agent/fix-psplus-and-game-hub-images
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Descargar candidatas de RAWG
        env:
          RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
        run: node scripts/fetch-onimusha-rawg-candidates.mjs

      - name: Guardar candidatas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/game-hubs/onimusha-way-of-the-sword/rawg-candidates data/game-hubs/onimusha-rawg-candidates.json
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Descarga candidatas RAWG para la ficha de Onimusha"
            git push origin HEAD:agent/fix-psplus-and-game-hub-images
          fi
