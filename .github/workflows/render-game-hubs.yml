name: Renderizar fichas de juego

on:
  push:
    paths:
      - "data/game-hubs/*.json"
      - "scripts/render-game-hubs.mjs"
      - "scripts/render-game-hub-pc-requirements.mjs"
      - "scripts/render-game-hub-editions.mjs"
      - "scripts/validate-game-hub-pc-requirements.mjs"
      - "scripts/validate-game-hub-editions.mjs"
      - "css/game-hub-pc-requirements.css"
      - "css/game-hub-editions.css"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: game-hubs-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el repositorio
        uses: actions/checkout@v4

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Volcar datos, multimedia, requisitos y ediciones al HTML
        run: |
          node scripts/render-game-hubs.mjs
          node scripts/render-game-hub-pc-requirements.mjs
          node scripts/render-game-hub-editions.mjs
          node scripts/validate-game-hub-pc-requirements.mjs
          node scripts/validate-game-hub-editions.mjs

      - name: Guardar las fichas actualizadas
        shell: bash
        run: |
          if git diff --quiet -- juegos juegos.html; then
            echo "Las fichas ya están al día."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add juegos juegos.html
          git commit -m "Renderiza las secciones dinámicas de las fichas de juego"
          git push
