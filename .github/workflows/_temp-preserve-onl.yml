name: Ajuste temporal de compatibilidad ONL

on:
  push:
    branches: [feature/state-of-play-sep-2026]
    paths:
      - ".github/workflows/_temp-preserve-onl.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v4
        with:
          ref: feature/state-of-play-sep-2026
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar compatibilidad y regenerar Eventos
        run: |
          node scripts/_temp-preserve-onl-copy.mjs
          node --check scripts/render-events.mjs
          node scripts/render-events.mjs
          node scripts/validate-events.mjs
          node scripts/generate-sitemap.mjs
          git diff --check

      - name: Guardar cambios
        run: |
          rm scripts/_temp-preserve-onl-copy.mjs
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preservar la cobertura existente de la ONL"
          git push origin HEAD:feature/state-of-play-sep-2026
