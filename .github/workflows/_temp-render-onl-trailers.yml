name: Regeneración temporal ONL

on:
  push:
    branches: [fix/onl-individual-trailers]
    paths:
      - ".github/workflows/_temp-render-onl-trailers.yml"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v4
        with:
          ref: fix/onl-individual-trailers
          fetch-depth: 0

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Regenerar y validar Eventos
        run: |
          node scripts/render-events.mjs
          node scripts/validate-events.mjs
          git diff --check

      - name: Guardar superficies generadas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add eventos eventos.html
          if git diff --cached --quiet; then
            echo "No hay superficies pendientes."
            exit 0
          fi
          git commit -m "chore(events): regenerar enlaces de ONL"
          git push origin HEAD:fix/onl-individual-trailers
