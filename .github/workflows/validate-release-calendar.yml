name: Validar calendario de lanzamientos

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "data/calendar.json"
      - "data/rawg-image-requests.json"
      - "calendario.html"
      - "index.html"
      - "css/calendar-today.css"
      - "js/main.js"
      - "js/calendar-today.js"
      - "js/calendar-mosaic.js"
      - "js/calendar-countdown-prepare.js"
      - "js/calendar-countdown.js"
      - "scripts/calendar-utils.mjs"
      - "scripts/rawg-images.mjs"
      - "scripts/resolve-rawg-calendar-images.mjs"
      - "scripts/validate-rawg-images.mjs"
      - "scripts/update-release-calendar.mjs"
      - "scripts/generate-release-calendar.mjs"
      - "scripts/validate-release-calendar.mjs"
      - "scripts/validate-calendar-today.mjs"
      - "scripts/validate-calendar-change.mjs"
      - ".github/workflows/update-release-calendar.yml"
      - ".github/workflows/validate-release-calendar.yml"
      - ".github/workflows/update-playstation-plus.yml"
      - "docs/CALENDAR_UPDATE_CHECKLIST.md"
      - "docs/CALENDAR_AUTOMATION.md"
      - "docs/PROJECT_RULES.md"
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - "data/calendar.json"
      - "calendario.html"
      - "index.html"
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      pr_number:
        description: "Número de PR automática que debe procesarse"
        required: false
        type: string
      head_ref:
        description: "Rama automática esperada"
        required: false
        type: string

permissions:
  actions: write
  contents: write
  pull-requests: write

concurrency:
  group: validate-calendar-${{ inputs.pr_number || github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  dispatch:
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Lanzar la validación de las PR automáticas abiertas
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/pulls?state=open&base=main&per_page=100" \
            --jq '.[] | select(.draft == false and (.head.ref | startswith("bot/calendar-")) and .head.repo.full_name == env.GITHUB_REPOSITORY) | [.number, .head.ref] | @tsv' |
          while IFS=$'\t' read -r number head_ref; do
            gh workflow run validate-release-calendar.yml \
              --repo "$GITHUB_REPOSITORY" \
              --ref main \
              -f "pr_number=$number" \
              -f "head_ref=$head_ref"
          done

  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.pull_request.head.repo.full_name == github.repository &&
        (
          (github.event_name == 'pull_request_target' && startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/calendar-')) ||
          (github.event_name == 'pull_request' && !startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/calendar-'))
        )
      )
    runs-on: ubuntu-latest
    env:
      TZ: Europe/Madrid
      RAWG_API_KEY: ${{ secrets.RAWG_API_KEY }}
    steps:
      - name: Comprobar la PR automática antes de descargarla
        if: github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          REQUESTED_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(printf '%s' "$pr" | jq -r .state)"
          draft="$(printf '%s' "$pr" | jq -r .draft)"
          base_ref="$(printf '%s' "$pr" | jq -r .base.ref)"
          head_ref="$(printf '%s' "$pr" | jq -r .head.ref)"
          head_repo="$(printf '%s' "$pr" | jq -r .head.repo.full_name)"

          if [ "$state" != "open" ] || [ "$draft" != "false" ] || [ "$base_ref" != "main" ]; then
            echo "La PR automática no está abierta, lista y basada en main."
            exit 1
          fi
          if [ "$head_repo" != "$GITHUB_REPOSITORY" ]; then
            echo "La PR automática no procede del repositorio principal."
            exit 1
          fi
          if [ "$head_ref" != "$REQUESTED_REF" ]; then
            echo "La rama solicitada ya no coincide con la cabecera de la PR."
            exit 1
          fi
          case "$head_ref" in
            bot/calendar-*) ;;
            *)
              echo "La rama no pertenece a la automatización del calendario."
              exit 1
              ;;
          esac

          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^(data/calendar\.json|calendario\.html|index\.html)$' || true)"
          if [ -n "$invalid" ]; then
            echo "La PR automática contiene archivos no autorizados antes de descargarla:"
            echo "$invalid"
            exit 1
          fi

      - name: Descargar la rama de la PR
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.head_ref || github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Obtener main
        run: git fetch origin main

      - name: Cargar y retirar una clave RAWG temporal
        if: github.event_name == 'pull_request' || github.event_name == 'pull_request_target' || (github.event_name == 'workflow_dispatch' && inputs.pr_number != '')
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
        run: |
          if [ -z "$PR_BODY" ] && [ -n "$PR_NUMBER" ]; then
            PR_BODY="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --jq '.body // ""')"
            export PR_BODY
          fi
          python - <<'PY'
          import os, pathlib, re
          body = os.environ.get("PR_BODY", "")
          pattern = r"<!--\s*RAWG_API_KEY:([A-Za-z0-9_-]+)\s*-->"
          match = re.search(pattern, body)
          if not match:
              raise SystemExit(0)
          pathlib.Path("/tmp/rawg-key").write_text(match.group(1), encoding="utf-8")
          clean = re.sub(pattern, "", body).strip()
          pathlib.Path("/tmp/pr-body-clean").write_text(clean, encoding="utf-8")
          PY
          if [ ! -s /tmp/rawg-key ]; then
            exit 0
          fi
          key="$(cat /tmp/rawg-key)"
          echo "::add-mask::$key"
          echo "RAWG_API_KEY=$key" >> "$GITHUB_ENV"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER" --raw-field body="$(cat /tmp/pr-body-clean)" >/dev/null
          rm -f /tmp/rawg-key /tmp/pr-body-clean

      - name: Comprobar sintaxis
        run: |
          node --check scripts/calendar-utils.mjs
          node --check scripts/rawg-images.mjs
          node --check scripts/resolve-rawg-calendar-images.mjs
          node --check scripts/validate-rawg-images.mjs
          node --check scripts/update-release-calendar.mjs
          node --check scripts/generate-release-calendar.mjs
          node --check scripts/validate-release-calendar.mjs
          node --check scripts/validate-calendar-today.mjs
          node --check scripts/validate-calendar-change.mjs
          node --check js/calendar-today.js
          node --check js/calendar-mosaic.js
          node --check js/calendar-countdown-prepare.js
          node --check js/calendar-countdown.js
          node --check js/main.js

      - name: Probar el estado Sale hoy
        run: node scripts/validate-calendar-today.mjs

      - name: Probar la selección de imágenes RAWG
        run: node scripts/validate-rawg-images.mjs

      - name: Probar el mantenimiento diario contra fuentes oficiales
        if: !startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/calendar-')
        run: |
          node scripts/update-release-calendar.mjs
          node scripts/generate-release-calendar.mjs
          node scripts/validate-release-calendar.mjs
          git diff --check
          git checkout -- data/calendar.json calendario.html index.html

      - name: Resolver imágenes RAWG solicitadas
        run: node scripts/resolve-rawg-calendar-images.mjs

      - name: Verificar cambios editoriales y fuentes
        run: node scripts/validate-calendar-change.mjs

      - name: Generar calendario y portada
        run: node scripts/generate-release-calendar.mjs

      - name: Aplicar checklist automática
        run: |
          node scripts/validate-release-calendar.mjs
          git diff --check

      - name: Limitar las ramas automáticas a datos y salidas generadas
        if: startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/calendar-')
        run: |
          files="$({ git diff --name-only origin/main...HEAD; git diff --name-only; } | sort -u)"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^(data/calendar\.json|calendario\.html|index\.html)$' || true)"
          if [ -n "$invalid" ]; then
            echo "Una rama automática ha modificado archivos no autorizados:"
            echo "$invalid"
            exit 1
          fi

      - name: Preparar la cabecera final de la rama automática
        if: startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/calendar-')
        id: automatic_head
        env:
          HEAD_REF: ${{ inputs.head_ref || github.event.pull_request.head.ref }}
        run: |
          if ! git diff --quiet -- data/calendar.json calendario.html index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/calendar.json calendario.html index.html
            git commit -m "Genera el calendario desde los datos verificados"
            git push origin "HEAD:$HEAD_REF"
          else
            echo "Los datos y las salidas generadas ya están sincronizados."
          fi
          if [ -n "$(git status --porcelain)" ]; then
            echo "El árbol de trabajo no quedó limpio después de generar el calendario."
            git status --short
            exit 1
          fi
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Fusionar el resultado final verificado
        if: startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/calendar-')
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ inputs.pr_number || github.event.pull_request.number }}
          EXPECTED_SHA: ${{ steps.automatic_head.outputs.sha }}
        run: |
          pr="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER")"
          state="$(printf '%s' "$pr" | jq -r .state)"
          draft="$(printf '%s' "$pr" | jq -r .draft)"
          base_ref="$(printf '%s' "$pr" | jq -r .base.ref)"
          head_ref="$(printf '%s' "$pr" | jq -r .head.ref)"
          remote_sha="$(printf '%s' "$pr" | jq -r .head.sha)"

          if [ "$state" != "open" ] || [ "$draft" != "false" ] || [ "$base_ref" != "main" ]; then
            echo "La PR no está abierta, lista y basada en main."
            exit 1
          fi
          case "$head_ref" in
            bot/calendar-*) ;;
            *)
              echo "La rama ya no pertenece a la automatización del calendario."
              exit 1
              ;;
          esac
          if [ "$remote_sha" != "$EXPECTED_SHA" ]; then
            echo "La cabecera remota cambió después de la validación."
            echo "Esperada: $EXPECTED_SHA"
            echo "Remota:   $remote_sha"
            exit 1
          fi

          files="$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR_NUMBER/files" --jq '.[].filename')"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^(data/calendar\.json|calendario\.html|index\.html)$' || true)"
          if [ -n "$invalid" ]; then
            echo "La PR automática contiene archivos no autorizados:"
            echo "$invalid"
            exit 1
          fi

          gh pr merge "$PR_NUMBER" \
            --repo "$GITHUB_REPOSITORY" \
            --squash \
            --delete-branch \
            --match-head-commit "$EXPECTED_SHA"
      - name: Guardar datos y páginas generadas en la rama manual
        if: !startsWith(inputs.head_ref || github.event.pull_request.head.ref, 'bot/calendar-')
        run: |
          if git diff --quiet -- data/calendar.json calendario.html index.html; then
            echo "Los datos y las salidas generadas ya están sincronizados."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/calendar.json calendario.html index.html
          git commit -m "Sincroniza los datos y las salidas del calendario"
          git push origin HEAD:${{ inputs.head_ref || github.event.pull_request.head.ref || github.ref_name }}
