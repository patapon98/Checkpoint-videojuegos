name: Aplicar noticias del 30 de julio

on:
  push:
    branches:
      - bot/news-2026-07-30-1620-xbox-double-fine

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Aplicar noticias
        run: node scripts/apply-news-20260730.mjs

      - name: Validar sintaxis
        run: node --check js/news-data.js

      - name: Guardar cambios
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No hay cambios pendientes."
            exit 0
          fi
          git commit -m "Añade resultados de Xbox y despidos de Double Fine"
          git push
