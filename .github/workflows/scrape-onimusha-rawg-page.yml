name: Extraer capturas públicas de RAWG

on:
  push:
    branches:
      - agent/fix-psplus-and-game-hub-images
    paths:
      - scripts/scrape-onimusha-rawg-page.mjs
      - .github/workflows/scrape-onimusha-rawg-page.yml

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar la rama
        uses: actions/checkout@v4
        with:
          ref: agent/fix-psplus-and-game-hub-images
          fetch-depth: 0

      - name: Preparar Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Extraer imágenes públicas de RAWG
        run: node scripts/scrape-onimusha-rawg-page.mjs

      - name: Guardar manifiesto
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/game-hubs/onimusha-rawg-page-images.json data/game-hubs/onimusha-rawg-page-debug.html 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No hay cambios que guardar."
          else
            git commit -m "Obtiene capturas públicas de RAWG para Onimusha"
            git push origin HEAD:agent/fix-psplus-and-game-hub-images
          fi
