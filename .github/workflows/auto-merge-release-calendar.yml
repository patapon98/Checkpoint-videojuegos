name: Fusionar calendario validado

on:
  workflow_run:
    workflows: ["Validar calendario de lanzamientos"]
    types: [completed]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: auto-merge-release-calendar
  cancel-in-progress: false

jobs:
  merge:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Localizar la PR asociada al commit validado
        id: pr
        run: |
          number="$(gh api "repos/${GITHUB_REPOSITORY}/commits/${{ github.event.workflow_run.head_sha }}/pulls" --jq '[.[] | select(.state == "open" and (.head.ref | startswith("bot/calendar-")))][0].number // empty')"
          if [ -z "$number" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          head_sha="$(gh pr view "$number" --repo "$GITHUB_REPOSITORY" --json headRefOid --jq .headRefOid)"
          if [ "$head_sha" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "La PR avanzó a otro commit y tendrá una nueva validación."
            echo "found=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "found=true" >> "$GITHUB_OUTPUT"
          echo "number=$number" >> "$GITHUB_OUTPUT"

      - name: Comprobar el alcance de la PR automática
        if: steps.pr.outputs.found == 'true'
        run: |
          number="${{ steps.pr.outputs.number }}"
          files="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/pulls/$number/files" --jq '.[].filename')"
          invalid="$(printf '%s\n' "$files" | grep -Ev '^(data/calendar\.json|calendario\.html|index\.html)$' || true)"
          if [ -n "$invalid" ]; then
            echo "La PR automática contiene archivos no autorizados:"
            echo "$invalid"
            exit 1
          fi

      - name: Fusionar y eliminar la rama
        if: steps.pr.outputs.found == 'true'
        run: |
          number="${{ steps.pr.outputs.number }}"
          gh pr merge "$number" --repo "$GITHUB_REPOSITORY" --squash --delete-branch
